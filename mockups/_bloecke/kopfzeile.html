<header class="kopf">
  <div class="kopf-zeile">
    <h1><i class="fa-solid fa-display"></i>Display</h1>
    <span class="chip-status" title="Das Display antwortet; Bilder kommen an"><i class="fa-solid fa-circle-check"></i>Verbunden</span>
    <div class="kopf-rechts">
      <button class="btn" title="Fertige Bildschirme einfügen und danach anpassen"><i class="fa-solid fa-layer-group"></i>Vorlagen</button>
      <button class="btn" title="Zusammenstellungen sichern und wechseln, Export und Import"><i class="fa-solid fa-box-archive"></i>Profile</button>
      <button class="btn" title="Orte für die Wetterwerte verwalten"><i class="fa-solid fa-cloud-sun"></i>Wetterorte</button>
      <button class="btn" style="width:44px;padding:0" title="Hilfe öffnen"><i class="fa-solid fa-question"></i></button>
    </div>
  </div>
  <div class="kopf-zeile">
    <div class="kopf-gruppe">
      <span class="label">Betriebsart</span>
      <div class="segment">
        <button class="active" title="Alle Bildschirme der Reihe nach anzeigen, jeweils für das eingestellte Intervall"><i class="fa-solid fa-rotate"></i>Rotation</button>
        <button title="Nur den gewählten Bildschirm anzeigen, ohne Wechsel"><i class="fa-solid fa-thumbtack"></i>Fest</button>
        <button title="Display dunkel schalten; die Bildschirme bleiben erhalten"><i class="fa-solid fa-power-off"></i>Aus</button>
      </div>
    </div>
    <div class="kopf-gruppe">
      <span class="label">Wechsel alle</span>
      <div class="stufen" title="Anzeigedauer je Bildschirm bei Rotation, 1 bis 3600 Sekunden"><button><i class="fa-solid fa-minus"></i></button><span class="wert">10 s</span><button><i class="fa-solid fa-plus"></i></button></div>
    </div>
    <div class="kopf-gruppe">
      <span class="label">Helligkeit</span>
      <div class="regler" title="Helligkeit des Displays von 0 bis 255; niedrige Werte schonen das Display"><input type="range" min="0" max="255" value="30"><span class="wert">30</span></div>
    </div>
  </div>
</header>
