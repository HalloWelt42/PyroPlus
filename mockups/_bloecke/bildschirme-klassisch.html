<section class="spalte spalte-bildschirme">
  <div class="spalte-kopf"><span>Bildschirme</span><span class="badge badge-neutral">4</span></div>
  <div class="spalte-inhalt">
    <div class="bs-karte ziel" title="Wird gerade auf dem Display angezeigt">
      <div class="bs-bild"><img src="/mockups/bilder/vorlage-messuhren.png" alt="Messuhren"></div>
      <div class="bs-zeile"><i class="fa-solid fa-grip-vertical bs-griff"></i><span class="bs-name">Messuhren</span></div>
      <div class="bs-meta"><span class="bs-marke"><i class="fa-solid fa-circle-dot"></i>Auf dem Display</span><span class="schalter klein on" title="Nimmt an der Rotation teil"></span></div>
    </div>
    <div class="bs-karte active" title="Wird gerade bearbeitet">
      <div class="bs-bild"><img src="/mockups/bilder/vorlage-klassisch.png" alt="Klassisch"></div>
      <div class="bs-zeile"><i class="fa-solid fa-grip-vertical bs-griff"></i><span class="bs-name">Uhr und System</span></div>
      <div class="bs-meta"><span class="bs-marke aus">10 s</span><span class="schalter klein on" title="Nimmt an der Rotation teil"></span></div>
    </div>
    <div class="bs-karte">
      <div class="bs-bild"><img src="/mockups/bilder/vorlage-wetter_jetzt.png" alt="Wetter jetzt"></div>
      <div class="bs-zeile"><i class="fa-solid fa-grip-vertical bs-griff"></i><span class="bs-name">Wetter Berlin</span></div>
      <div class="bs-meta"><span class="bs-marke aus">20 s</span><span class="schalter klein on" title="Nimmt an der Rotation teil"></span></div>
    </div>
    <div class="bs-karte">
      <div class="bs-bild"><img src="/mockups/bilder/vorlage-laufwerke.png" alt="Laufwerke"></div>
      <div class="bs-zeile"><i class="fa-solid fa-grip-vertical bs-griff"></i><span class="bs-name">Laufwerke</span></div>
      <div class="bs-meta"><span class="bs-marke aus">Nicht in Rotation</span><span class="schalter klein" title="Nimmt an der Rotation teil"></span></div>
    </div>
  </div>
  <div class="spalte-fuss">
    <button class="btn btn-accent btn-breit" title="Leeren Bildschirm anlegen"><i class="fa-solid fa-plus"></i>Neuer Bildschirm</button>
    <div class="btn-reihe">
      <button class="btn btn-klein" title="Fertigen Bildschirm aus den Vorlagen einfügen"><i class="fa-solid fa-layer-group"></i>Vorlage</button>
      <button class="btn btn-klein" title="Gewählten Bildschirm kopieren"><i class="fa-solid fa-copy"></i>Kopie</button>
    </div>
  </div>
</section>
