<section class="spalte spalte-canvas">
  <div class="canvas-leiste">
    <div class="segment klein" title="Vergrößerung der Vorschau; das Display hat 128 mal 64 Pixel">
      <button>2x</button><button>3x</button><button class="active">4x</button><button>6x</button>
    </div>
    <button class="btn btn-klein active" title="Hilfslinien alle 8 Pixel einblenden"><i class="fa-solid fa-border-all"></i>Raster</button>
    <button class="btn btn-klein" title="Beim Verschieben auf das Raster einrasten"><i class="fa-solid fa-magnet"></i>Einrasten</button>
    <button class="btn btn-klein btn-symbol" title="Letzte Änderung zurücknehmen"><i class="fa-solid fa-rotate-left"></i></button>
    <button class="btn btn-klein btn-symbol" title="Zurückgenommene Änderung wiederholen"><i class="fa-solid fa-rotate-right"></i></button>
    <div class="rechts">
      <span class="badge badge-ok"><i class="fa-solid fa-circle-check"></i>Gespeichert</span>
      <button class="btn btn-klein btn-accent" title="Diesen Bildschirm jetzt auf dem Display zeigen und die Rotation dort fortsetzen"><i class="fa-solid fa-eye"></i>Auf dem Display zeigen</button>
    </div>
  </div>
  <div class="canvas-feld">
    <div class="geraet">
      <div class="geraet-schirm raster">
        <img src="/mockups/bilder/vorlage-messuhren.png" alt="Messuhren, Vorschau vom Backend">
        <div class="auswahl" style="left:32px;top:16px;width:180px;height:104px"><span class="etikett">CPU</span></div>
      </div>
    </div>
  </div>
  <div class="canvas-fuss">
    <span>Position <span class="mono">8, 4</span></span>
    <span>Größe <span class="mono">45 x 26</span></span>
    <span>Widgets <span class="mono">7</span></span>
    <span class="hinweis">Ziehen verschiebt · <span class="kbd">Pfeile</span> 1 px · Rechtsklick: Menü</span>
  </div>
</section>
