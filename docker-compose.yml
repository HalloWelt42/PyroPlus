services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pyroplus-backend
    ports:
      - "8071:8071"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - /:/host:ro
      - /mnt:/mnt:ro
    environment:
      - LOG_LEVEL=INFO
      - HW_PROXY_URL=http://host.docker.internal:8072
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pyroplus-frontend
    ports:
      - "8070:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
