server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Manifest für den Startbildschirm mit richtigem Medientyp
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Startseite nie zwischenspeichern, sonst bleibt nach einem Update die alte Oberfläche stehen
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Einseitige Anwendung
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Weiterleitung zur Schnittstelle
    location /api/ {
        proxy_pass http://backend:8071/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket Proxy
    location /ws {
        proxy_pass http://backend:8071/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Gebaute Dateien tragen einen Hash im Namen und dürfen lange im Zwischenspeicher bleiben
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
